[package]
name = "mmr-rom"
description = "N64 ROM handling for the Majora's Mask Randomizer: validation, the file system, Yaz0, and building the output ROM."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rayon = { version = "1", optional = true }

[features]
default = ["parallel"]
# Compress files on several threads (off for the browser build).
parallel = ["dep:rayon"]
